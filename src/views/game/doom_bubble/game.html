<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pac-Man Auto Move</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; position: relative; }
        canvas { display: block; }
        #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color:  rgb(144, 0, 255);
            font-size: 150px;
            font-family: Arial, sans-serif;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="gameOverScreen">GAME OVER</div>
    <script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const gameOverScreen = document.getElementById("gameOverScreen");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

document.body.style.margin = "0";
document.body.style.overflow = "hidden";

const tileSize = 30;
const rows = Math.floor(canvas.height / tileSize);
const cols = Math.floor(canvas.width / tileSize);

const map = [
    "##############################################", 
    "#.................#..........................#",
    "#.####.#####.####.#.#####.####.#####.####.#..#",
    "#.#  #.#...#.#  #.#.#...#.#  #.#...#.#  #.#..#",
    "#.####.#.#.#.####.#.#.#.#.####.#.#.#.####.#..#",
    "#......#.....*........#........#.............#",
    "#.####.#####.#.#####.#######.#####.########..#",
    "#.#..#.#   #.#.#...#.#.....#.#..*#.#      #..#",
    "#.#..#.#   #...#...#.#.###.#.#...#.#      #..#",
    "#......##########............###.##########..#",
    "######.###........#######.######.............#",
    "#..........#.####.........#.......#####.##.#.#",
    "#.####.###.#.####.###.#####.#####.#   #.##.#.#",
    "#.#  #.# #.#.#  #.# #.#.......###.#   #.##.#.#",
    "#*####.# #.#.####.# #.#.#####.###.#####.##.#.#",
    "#.####.###........#####.#*##..##.............#",
    "#..........#.####.........#.......#####.##.#.#",
    "#.####.###.#.####.###.#####.#####.#   #.##.#.#",
    "#.#  #.#.#.#.#  #.#*#.#.......###.#   #.##.#.#",
    "#.####.#.#.#.####.#.#.#.#####.###.#####.##.#.#",
    "#..........#................#................#",
    "##############################################"
];

class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = tileSize;
        this.color = "white";
        this.dx = 0; // Pac-Man mulai bergerak ke kanan
        this.dy = 0;
        this.mouthAngle = Math.PI / 4;
        this.mouthDirection = 1;
        this.speed = 2; // Kecepatan lebih alami
        this.direction = "right"; // Awalnya menghadap kanan
    }

    draw() {
    ctx.fillStyle = this.color;
    ctx.beginPath();
    
    // Menentukan sudut mulut berdasarkan arah
    let startAngle = this.mouthAngle;
    let endAngle = Math.PI * 2 - this.mouthAngle;

    // Jika menghadap ke atas, geser sudut ke atas
    if (this.dy < 0) {
        startAngle = Math.PI / 2 + this.mouthAngle; // Atas
        endAngle = Math.PI * 3 / 2 - this.mouthAngle;
    }
    // Jika menghadap ke bawah
    else if (this.dy > 0) {
        startAngle = Math.PI * 1.5 + this.mouthAngle; // Bawah
        endAngle = Math.PI / 2 - this.mouthAngle;
    }
    // Jika menghadap ke kiri
    else if (this.dx < 0) {
        startAngle = Math.PI + this.mouthAngle; // Kiri
        endAngle = Math.PI * 2 - this.mouthAngle;
    }
    // Jika menghadap ke kanan (default)
    else if (this.dx > 0) {
        startAngle = this.mouthAngle; // Kanan
        endAngle = Math.PI * 2 - this.mouthAngle;
    }

    // Menggambar mulut Pac-Man
    ctx.arc(
        this.x + this.size / 2,
        this.y + this.size / 2,
        this.size / 2,
        startAngle,
        endAngle
    );
    ctx.lineTo(this.x + this.size / 2, this.y + this.size / 2);
    ctx.fill();
}

    move() {
        let newX = this.x + this.dx;
        let newY = this.y + this.dy;

        if (!isWall(newX, newY)) {
            this.x = newX;
            this.y = newY;
        } else {
            this.dx = 0;
            this.dy = 0; // Jika menabrak dinding, berhenti hingga pemain menggerakkan
        }
    }

    setDirection(newDx, newDy) {
        if (newDx === tileSize) {
            this.direction = "right";
        } else if (newDx === -tileSize) {
            this.direction = "left";
        } else if (newDy === tileSize) {
            this.direction = "down";
        } else if (newDy === -tileSize) {
            this.direction = "up";
        }
    }

    updateMouth() {
        if (this.mouthDirection === 1) {
            this.mouthAngle += Math.PI / 60;
            if (this.mouthAngle >= Math.PI / 2) {
                this.mouthDirection = -1;
            }
        } else {
            this.mouthAngle -= Math.PI / 60;
            if (this.mouthAngle <= Math.PI / 4) {
                this.mouthDirection = 1;
            }
        }
    }
}

class Enemy {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.size = tileSize;
        this.color = color;
        this.speed = tileSize / 2;
        this.path = [];
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        // Kepala hantu (setengah lingkaran)
        ctx.arc(this.x + this.size / 2, this.y + this.size / 2, this.size / 2, Math.PI, 0);
        ctx.lineTo(this.x + this.size, this.y + this.size);
        ctx.lineTo(this.x, this.y + this.size);
        ctx.closePath();
        ctx.fill();

        // Mata
        ctx.fillStyle = "white";
        ctx.beginPath();
        ctx.arc(this.x + this.size / 3, this.y + this.size / 3, this.size / 6, 0, Math.PI * 2);
        ctx.arc(this.x + (2 * this.size) / 3, this.y + this.size / 3, this.size / 6, 0, Math.PI * 2);
        ctx.fill();

        // Pupil
        ctx.fillStyle = "blue";
        ctx.beginPath();
        ctx.arc(this.x + this.size / 3, this.y + this.size / 3, this.size / 12, 0, Math.PI * 2);
        ctx.arc(this.x + (2 * this.size) / 3, this.y + this.size / 3, this.size / 12, 0, Math.PI * 2);
        ctx.fill();
    }

    move(player) {
        if (this.path.length === 0 || Math.random() < 0.05) { // Kurangi update jalur agar musuh lebih pasif
            this.path = this.findPath({ x: Math.floor(this.x / tileSize), y: Math.floor(this.y / tileSize) }, 
                                      { x: Math.floor(player.x / tileSize), y: Math.floor(player.y / tileSize) });
        }
        
        if (this.path.length > 0) {
            let nextStep = this.path.shift();
            setTimeout(() => { // Menambahkan delay agar musuh bergerak lebih lambat
                this.x = nextStep.x * tileSize;
                this.y = nextStep.y * tileSize;
            }, 200);
        }

        // Cek jika pemain tertangkap
        if (this.x === player.x && this.y === player.y) {
            gameOver();
        }
    }

    static moveAll(enemies, player) {
        enemies.forEach((enemy, index) => {
            setTimeout(() => {
                enemy.move(player);
            }, index * 500); // Menambahkan jeda antar musuh agar tidak serempak bergerak
        });
    }

    findPath(start, goal) {
        let openSet = [start];
        let cameFrom = {};
        let gScore = { [`${start.x},${start.y}`]: 0 };
        let fScore = { [`${start.x},${start.y}`]: this.heuristic(start, goal) };
        
        while (openSet.length > 0) {
            openSet.sort((a, b) => fScore[`${a.x},${a.y}`] - fScore[`${b.x},${b.y}`]);
            let current = openSet.shift();
            
            if (current.x === goal.x && current.y === goal.y) {
                return this.reconstructPath(cameFrom, current);
            }
            
            for (let neighbor of this.getNeighbors(current)) {
                let tempGScore = gScore[`${current.x},${current.y}`] + 1;
                let neighborKey = `${neighbor.x},${neighbor.y}`;
                
                if (!(neighborKey in gScore) || tempGScore < gScore[neighborKey]) {
                    cameFrom[neighborKey] = current;
                    gScore[neighborKey] = tempGScore;
                    fScore[neighborKey] = tempGScore + this.heuristic(neighbor, goal);
                    if (!openSet.some(n => n.x === neighbor.x && n.y === neighbor.y)) {
                        openSet.push(neighbor);
                    }
                }
            }
        }
        return [];
    }

    reconstructPath(cameFrom, current) {
        let path = [];
        let key = `${current.x},${current.y}`;
        while (cameFrom[key]) {
            path.unshift(current);
            current = cameFrom[key];
            key = `${current.x},${current.y}`;
        }
        return path;
    }

    heuristic(a, b) {
        return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    }

    getNeighbors(node) {
        let directions = [
            { x: 0, y: -1 }, { x: 0, y: 1 }, 
            { x: -1, y: 0 }, { x: 1, y: 0 }
        ];
        let neighbors = [];
        for (let dir of directions) {
            let newX = node.x + dir.x;
            let newY = node.y + dir.y;
            if (!isWall(newX * tileSize, newY * tileSize)) {
                neighbors.push({ x: newX, y: newY });
            }
        }
        return neighbors;
    }
}

const player = new Player(tileSize, tileSize);
const enemies = [ 
    new Enemy(20 * tileSize, 15 * tileSize),
    new Enemy(15 * tileSize, 15 * tileSize),
    new Enemy(5 * tileSize, 15 * tileSize)
];

window.addEventListener("keydown", (e) => {
    let newDx = 0, newDy = 0;

    if (e.key === "ArrowRight") { newDx = tileSize; newDy = 0; }
    if (e.key === "ArrowLeft") { newDx = -tileSize; newDy = 0; }
    if (e.key === "ArrowUp") { newDx = 0; newDy = -tileSize; }
    if (e.key === "ArrowDown") { newDx = 0; newDy = tileSize; }

    // Hanya ubah arah jika bukan tembok
    if (!isWall(player.x + newDx, player.y + newDy)) {
        player.dx = newDx;
        player.dy = newDy;
    }
});

let pelletsCount = 0;
for (let row of map) {
    pelletsCount += (row.match(/\./g) || []).length;
}

function isWall(x, y) {
    let row = Math.floor(y / tileSize);
    let col = Math.floor(x / tileSize);
    return map[row] && map[row][col] === "#";
}

function eatPellet(x, y) {
    let row = Math.floor(y / tileSize);
    let col = Math.floor(x / tileSize);
    
    if (map[row][col] === ".") {
        map[row] = map[row].substring(0, col) + " " + map[row].substring(col + 1);
        pelletsCount--;
        if (pelletsCount === 0) {
            gameWon();
        }
    } else if (map[row][col] === "*") {
        map[row] = map[row].substring(0, col) + " " + map[row].substring(col + 1);
        starCount--;
        if (starCount === 0) {
            gameWin();
        }
    }
}

function activateStarPower() {
    player.speed = 5; // Pac-Man menjadi lebih cepat
    setTimeout(() => {
        player.speed = 2; // Kembali ke kecepatan normal setelah 5 detik
    }, 5000);
}

function drawMap() {
    for (let row = 0; row < map.length; row++) {
        for (let col = 0; col < map[row].length; col++) {
            if (map[row][col] === "#") {
                ctx.fillStyle = "purple";
                ctx.fillRect(col * tileSize, row * tileSize, tileSize, tileSize);
            } else if (map[row][col] === ".") {
                ctx.fillStyle = "gold";
                ctx.beginPath();
                ctx.arc(col * tileSize + tileSize / 2, row * tileSize + tileSize / 2, 5, 0, Math.PI * 2);
                ctx.fill();
            } else if (map[row][col] === "*") {
                drawStar(col * tileSize, row * tileSize);
            }
        }
    }
}

function drawStar(x, y) {
    ctx.fillStyle = "yellow";
    ctx.beginPath();
    let rot = Math.PI / 2 * 3;
    let cx = x + tileSize / 2;
    let cy = y + tileSize / 2;
    let spikes = 5;
    let step = Math.PI / spikes;
    let outerRadius = tileSize / 3;
    let innerRadius = tileSize / 6;
    
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
        let x1 = cx + Math.cos(rot) * outerRadius;
        let y1 = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x1, y1);
        rot += step;
        let x2 = cx + Math.cos(rot) * innerRadius;
        let y2 = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x2, y2);
        rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fill();
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawMap();
    player.move();
    eatPellet(player.x, player.y); // Cek apakah memakan pelet atau bintang
    player.draw();
    player.updateMouth();
    enemies.forEach(enemy => {
        enemy.move(player);
        enemy.draw();
    });
    setTimeout(() => requestAnimationFrame(gameLoop), 1000 / 10);
}

function gameOver() {
    isGameOver = true;
    player.dx = 0;
    player.dy = 0;
    gameOverScreen.style.display = "block";
    setTimeout(() => {
        window.location.href = 'index.php'; // kembali ke halaman index
    }, 2500);
}

function gameWin() {
    gameOverScreen.innerText = "YOU WIN!";
    gameOverScreen.style.display = "block";
    setTimeout(() => {
        window.location.href = 'index.php';
    }, 2500);
}

let starCount = 0;
for (let row of map) {
    starCount += (row.match(/\*/g) || []).length;
}

function restartGame() {
    location.reload();
}

window.addEventListener("keydown", (e) => {
    let newDx = 0, newDy = 0;

    if (e.key === "ArrowRight") { 
        newDx = tileSize; 
        newDy = 0; 
    }
    if (e.key === "ArrowLeft") { 
        newDx = -tileSize; 
        newDy = 0; 
    }
    if (e.key === "ArrowUp") { 
        newDx = 0; 
        newDy = -tileSize; 
    }
    if (e.key === "ArrowDown") { 
        newDx = 0; 
        newDy = tileSize; 
    }

    // Hanya ubah arah jika bukan tembok
    if (!isWall(player.x + newDx, player.y + newDy)) {
        player.setDirection(newDx, newDy); // Memperbarui arah yang dihadapi
        player.dx = newDx;
        player.dy = newDy;
    }
});
gameLoop();
    </script>
</body>
</html>
